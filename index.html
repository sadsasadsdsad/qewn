<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Черновик — минималистичное приложение для написания книг">
<title>Черновик — библиотека</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191712'/%3E%3Crect x='11' y='11' width='10' height='10' fill='%23c93a2b' transform='rotate(45 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,300..700;1,7..72,300..700&family=Unbounded:wght@300;400;500;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     БИБЛИОТЕКА
     ═══════════════════════════════════════════════════════════════ -->
<section id="library" aria-label="Библиотека книг">
  <header class="lib-top">
    <div class="brand">
      <span class="dia" aria-hidden="true"></span>
      <b>ЧЕРНОВИК</b>
      <small>для книг</small>
    </div>
    <div class="lib-actions">
      <button class="ibtn" id="btnBackup" title="Резервная копия: скачать все книги" aria-label="Скачать резервную копию">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 4v9m0 0 3.5-3.5M12 13 8.5 9.5"/>
          <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
        </svg>
      </button>
      <button class="ibtn" id="btnRestore" title="Резервная копия: загрузить из файла" aria-label="Загрузить резервную копию">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 13V4m0 0 3.5 3.5M12 4 8.5 7.5"/>
          <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
        </svg>
      </button>
      <button class="ibtn btn-theme" title="Переключить тему" aria-label="Переключить тему">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>
        </svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none" aria-hidden="true">
          <path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="lib-body">
    <div class="lib-head">
      <div>
        <div class="lbl lbl-acc">Библиотека</div>
        <h1 class="lib-title">Ваши книги</h1>
      </div>
      <div class="lib-stats" id="libStats" aria-live="polite"></div>
    </div>
    <div class="shelf" id="shelf" role="list" aria-label="Список книг"></div>
    <div class="lib-foot">все рукописи хранятся локально · делайте резервные копии</div>
  </div>
</section>

<input type="file" id="restoreInput" accept=".json,application/json" hidden>

<!-- ═══════════════════════════════════════════════════════════════
     ОБЗОР КНИГИ
     ═══════════════════════════════════════════════════════════════ -->
<section id="bookView" hidden aria-label="Обзор книги">
  <header class="bv-top">
    <div class="left">
      <button class="ibtn" id="bvBack" title="Назад в библиотеку" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </button>
      <button class="ibtn" id="bvOpen" title="Открыть редактор" aria-label="Открыть редактор">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
      </button>
    </div>
    <div class="right">
      <button class="ibtn" id="bvExport" title="Экспорт книги" aria-label="Экспорт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v9m0 0 3.5-3.5M12 13 8.5 9.5"/>
          <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
        </svg>
      </button>
    </div>
  </header>
  <div class="bv-body">
    <div class="bv-head">
      <div class="bv-title-row">
        <span class="cv-dia" aria-hidden="true"></span>
        <h1 id="bvTitle"></h1>
        <span class="bv-type">рукопись</span>
      </div>
      <p class="bv-desc" id="bvDesc"></p>
      <div class="bv-stats" id="bvStats"></div>
    </div>
    <div class="bv-sec">
      <div class="lbl lbl-acc">Главы</div>
      <div class="bv-grid" id="bvGrid" role="list"></div>
    </div>
  </div>
</section>

<!-- ═══════════════════════════════════════════════════════════════
     РАБОЧЕЕ ПРОСТРАНСТВО
     ═══════════════════════════════════════════════════════════════ -->
<div id="workspace" hidden>
  <aside>
    <div class="brand">
      <span class="dia" aria-hidden="true"></span>
      <b>ЧЕРНОВИК</b>
      <small>для книг</small>
    </div>
    <div class="bookbox">
      <input type="text" id="bookTitle" placeholder="Название книги" maxlength="80" aria-label="Название книги">
    </div>
    <div class="chapters-label">
      <span class="lbl lbl-acc">Главы</span>
      <span class="lbl" id="chCount"></span>
    </div>
    <div id="chlist" class="fadebox f-bot" role="list" aria-label="Список глав"></div>
    <button id="addCh" aria-label="Добавить главу">+ Новая глава</button>
    <div class="side-foot">
      <span id="totalWords"></span>
      <span id="totalRead"></span>
    </div>
    <div id="sideRz" class="rz" title="Изменить размер панели"></div>
  </aside>

  <main id="main">
    <header id="topbar">
      <button class="ibtn" id="btnSide" title="Боковая панель" aria-label="Боковая панель">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 6h18M3 12h18M3 18h18"/>
        </svg>
      </button>
      <nav class="crumb" aria-label="Хлебные крошки">
        <span class="cd"></span>
        <span id="crumbBook"></span>
        <span class="cd"></span>
        <b id="crumbCh"></b>
      </nav>
      <div class="tb-sep"></div>
      <button class="chip" id="btnZen" title="Режим фокуса (Esc)" aria-label="Режим фокуса">
        <span id="zenpill">Фокус</span>
      </button>
      <div class="tb-sep"></div>
      <button class="ibtn" id="btnWiki" title="Энциклопедия" aria-label="Энциклопедия">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </button>
      <button class="ibtn" id="btnSearch" title="Поиск (Ctrl+F)" aria-label="Поиск">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.3-4.3"/>
        </svg>
      </button>
      <button class="ibtn" id="btnSpell" title="Проверка орфографии" aria-label="Проверка орфографии">
        <svg class="wavy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 20h2a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H4"/>
          <path d="M10 20h6a2 2 0 0 0 2-2v-4"/>
          <path d="m16 12 4 4m0-4-4 4"/>
        </svg>
        <svg class="offline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="m15 9-6 6"/>
          <path d="m9 9 6 6"/>
          <path d="M4 20h16"/>
          <path d="m4 15 3-3"/>
          <path d="m17 12 3-3"/>
        </svg>
      </button>
      <button class="ibtn" id="btnExportTop" title="Экспорт" aria-label="Экспорт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 4v9m0 0 3.5-3.5M12 13 8.5 9.5"/>
          <path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/>
        </svg>
      </button>
      <button class="ibtn btn-theme" title="Переключить тему" aria-label="Переключить тему">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8"/>
        </svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" style="display:none">
          <path d="M20 13.5A8 8 0 0 1 10.5 4 8 8 0 1 0 20 13.5Z"/>
        </svg>
      </button>
      <button class="ibtn" id="btnShelf" title="Библиотека" aria-label="Библиотека">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
        </svg>
      </button>
    </header>

    <div id="scroller" class="fadebox">
      <div id="editor" contenteditable="true" spellcheck="false" aria-label="Редактор текста"></div>
    </div>

    <div id="edRz" class="rz" title="Изменить ширину редактора"></div>
  </main>

  <aside id="wikiPanel" hidden>
    <div id="wikiRz" class="rz" title="Изменить размер панели"></div>
    <div class="wp-head">
      <span class="wp-title">
        <span class="dia" aria-hidden="true"></span>
        Энциклопедия
        <span class="wp-count" id="wpCount"></span>
      </span>
      <button class="lbl lbl-btn" id="wpAdd" aria-label="Добавить новую статью">+ статья</button>
      <button class="sibtn" id="wpFull" title="Во весь экран" aria-label="Развернуть на весь экран">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
      <button class="sibtn" id="wpClose" title="Закрыть" aria-label="Закрыть энциклопедию">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>
    <input id="wpSearch" autocomplete="off" placeholder="Поиск по миру книги…" aria-label="Поиск по энциклопедии">
    <div class="wp-filters" id="wpFilters" role="group" aria-label="Фильтры по типам"></div>
    <div class="wp-body fadebox f-bot" id="wpBody" role="list" aria-label="Список статей"></div>
    <div id="wikiInner"></div>
  </aside>
</div>

<!-- Плавающее меню выделения -->
<div id="selbar" class="selbar" role="toolbar" aria-label="Форматирование">
  <button data-cmd="bold" title="Жирный"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg></button>
  <button data-cmd="italic" title="Курсив"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="4" x2="10" y2="4"/><line x1="14" y1="20" x2="5" y2="20"/><line x1="15" y1="4" x2="9" y2="20"/></svg></button>
  <div class="sb-sep"></div>
  <button data-cmd="h1" title="Заголовок 1"><span class="lbl">H1</span></button>
  <button data-cmd="h2" title="Заголовок 2"><span class="lbl">H2</span></button>
  <button data-cmd="blockquote" title="Цитата"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.237.25 4-2.75 4v3"/></svg></button>
  <button data-cmd="sep" title="Разделитель"><span class="lbl">───</span></button>
</div>

<!-- Меню блоков -->
<div id="blockmenu" class="bmenu" hidden role="menu">
  <button data-tag="p" role="menuitem"><span class="lbl">Текст</span></button>
  <button data-tag="h1" role="menuitem"><span class="lbl">Заголовок 1</span></button>
  <button data-tag="h2" role="menuitem"><span class="lbl">Заголовок 2</span></button>
  <button data-tag="blockquote" role="menuitem"><span class="lbl">Цитата</span></button>
  <div class="bm-sep"></div>
  <button data-tag="sep" role="menuitem"><span class="lbl">Разделитель</span></button>
</div>

<!-- Поиск -->
<div id="searchPanel" class="search-panel" hidden>
  <input type="text" id="searchInput" placeholder="Поиск по главе..." aria-label="Поиск">
  <div class="sp-controls">
    <button class="sibtn" id="prevHit" title="Назад"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="lbl" id="searchCount"></span>
    <button class="sibtn" id="nextHit" title="Вперёд"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <button class="sibtn" id="closeSearch" title="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<!-- Экспорт модал -->
<div id="exportModal" class="modal-overlay" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="exportTitle">
    <div class="modal-head">
      <h2 id="exportTitle" class="modal-title">Экспорт книги</h2>
      <button class="sibtn modal-close" id="closeExport" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="export-options">
        <button class="export-btn" data-format="txt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M14 2v6h6"/></svg>
          <span>TXT</span>
          <small>Простой текст</small>
        </button>
        <button class="export-btn" data-format="md">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="m9 10 3 3 3-3"/></svg>
          <span>Markdown</span>
          <small>MD формат</small>
        </button>
        <button class="export-btn" data-format="html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="m8 9 3 3-3 3"/><path d="m16 9-3 3 3 3"/></svg>
          <span>HTML</span>
          <small>Веб-страница</small>
        </button>
        <button class="export-btn" data-format="docx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><path d="M8 13h8"/><path d="M8 17h8"/><path d="M10 9h4"/></svg>
          <span>DOCX</span>
          <small>Word документ</small>
        </button>
        <button class="export-btn" data-format="fb2">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><circle cx="12" cy="10" r="3"/><path d="M12 13v4"/></svg>
          <span>FB2</span>
          <small>Литрес формат</small>
        </button>
        <button class="export-btn" data-format="epub">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/><path d="M12 8v8"/><path d="M8 12h8"/></svg>
          <span>EPUB</span>
          <small>E-book формат</small>
        </button>
      </div>
      <div class="export-settings">
        <label class="setting-row">
          <span class="setting-label">Включать главы:</span>
          <select id="exportChapters" class="setting-select">
            <option value="all">Все главы</option>
            <option value="current">Текущая глава</option>
          </select>
        </label>
        <label class="setting-row">
          <span class="setting-label">Название файла:</span>
          <input type="text" id="exportFilename" class="setting-input" placeholder="авто">
        </label>
      </div>
    </div>
  </div>
</div>

<!-- Энциклопедия модал -->
<div id="wikiViewModal" class="modal-overlay wiki-modal" hidden>
  <div class="wiki-view-card">
    <div class="wv-top">
      <button class="ibtn" id="closeWikiView" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m18 15-6-6-6 6"/></svg>
      </button>
      <span class="lbl lbl-acc" id="wvTypeLabel">ТЕРМИН</span>
      <div class="wv-actions">
        <button class="sibtn" id="wikiEditBtn" title="Редактировать"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg></button>
        <button class="sibtn" id="wikiDelBtn" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg></button>
      </div>
    </div>
    <div class="wv-body fadebox">
      <h1 id="wvTitle" class="wv-title"></h1>
      <div id="wvContent" class="wv-content"></div>
      <div id="wvQuotes" class="wv-quotes"></div>
    </div>
  </div>
</div>

<!-- Модал энциклопедии (создание/редактирование) -->
<div id="wikiModal" class="modal-overlay" hidden>
  <div class="modal-card wiki-form-card" role="dialog" aria-modal="true" aria-labelledby="wikiFormTitle">
    <div class="modal-head">
      <h2 id="wikiFormTitle" class="modal-title">Статья энциклопедии</h2>
      <button class="sibtn modal-close" id="closeWikiModal" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <input type="text" id="wikiTitleInput" class="wiki-input-title" placeholder="Название термина" maxlength="80">
      <select id="wikiTypeSelect" class="wiki-select-type"></select>
      <textarea id="wikiContentInput" class="wiki-textarea" placeholder="Описание термина..." rows="6"></textarea>
      <div class="wiki-quote-add">
        <input type="text" id="wikiQuoteInput" placeholder="Цитата из текста (необязательно)">
        <button class="ibtn" id="addWikiQuote" title="Добавить цитату">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div id="wikiQuotesList" class="wiki-quotes-list"></div>
    </div>
    <div class="modal-foot">
      <button class="chip" id="cancelWiki">Отмена</button>
      <button class="chip on" id="saveWiki">Сохранить</button>
    </div>
  </div>
</div>

<!-- Вуаль для мобильных -->
<div id="veil" hidden></div>

<div id="printBook" class="print-book" aria-hidden="true"></div>

<script src="js/app.js"></script>
</body>
</html>
