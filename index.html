<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Kyora Clone (Terraria Style)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Цвет неба */
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* Пиксельный стиль */
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 2px 2px 0 #000;
            pointer-events: none;
        }
        #inventory {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px;
            border-radius: 5px;
        }
        .slot {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            cursor: pointer;
            image-rendering: pixelated;
        }
        .slot.active {
            border-color: #fff;
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="ui">
    <h1>Kyora Prototype</h1>
    <p>WASD / Стрелки - Движение</p>
    <p>ЛКМ - Копать | ПКМ - Ставить блок</p>
    <p>1-4 - Выбор блока</p>
</div>

<div id="inventory"></div>
<canvas id="gameCanvas"></canvas>

<script>
// --- КОНФИГУРАЦИЯ ---
const TILE_SIZE = 32;
const WORLD_WIDTH = 200; // Ширина мира в блоках
const WORLD_HEIGHT = 100; // Высота мира в блоках
const GRAVITY = 0.5;
const TERMINAL_VELOCITY = 12;
const PLAYER_SPEED = 5;
const JUMP_FORCE = 9;

// Типы блоков
const BLOCKS = {
    AIR: 0,
    DIRT: 1,
    GRASS: 2,
    STONE: 3,
    WOOD: 4,
    LEAVES: 5
};

// Цвета для отрисовки (имитация текстур)
const BLOCK_COLORS = {
    [BLOCKS.DIRT]: '#5d4037',
    [BLOCKS.GRASS]: '#388e3c',
    [BLOCKS.STONE]: '#757575',
    [BLOCKS.WOOD]: '#4e342e',
    [BLOCKS.LEAVES]: '#2e7d32'
};

// --- ГЕНЕРАЦИЯ МИРА (Шум Перлина упрощенный) ---
class SimpleNoise {
    constructor() {
        this.perm = new Uint8Array(512);
        const p = new Uint8Array(256);
        for (let i = 0; i < 256; i++) p[i] = i;
        // Тасование
        for (let i = 255; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [p[i], p[j]] = [p[j], p[i]];
        }
        for (let i = 0; i < 512; i++) this.perm[i] = p[i & 255];
    }

    fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    lerp(t, a, b) { return a + t * (b - a); }
    grad(hash, x) {
        const h = hash & 15;
        let grad = 1 + (h & 7); 
        if ((h & 8) !== 0) grad = -grad;
        return grad * x;
    }

    noise(x) {
        const X = Math.floor(x) & 255;
        x -= Math.floor(x);
        const u = this.fade(x);
        return this.lerp(u, 
            this.grad(this.perm[X], x), 
            this.grad(this.perm[X + 1], x - 1)
        ) * 2; // Нормализация примерно к [-1, 1]
    }
}

const noise = new SimpleNoise();
const world = [];
const trees = [];

function generateWorld() {
    // Инициализация пустого мира
    for (let x = 0; x < WORLD_WIDTH; x++) {
        world[x] = new Array(WORLD_HEIGHT).fill(BLOCKS.AIR);
    }

    // Генерация ландшафта
    const baseHeight = WORLD_HEIGHT / 2;
    const amplitude = 15;
    
    for (let x = 0; x < WORLD_WIDTH; x++) {
        // Комбинируем несколько частот для детализации
        let n = noise.noise(x * 0.05) * amplitude + 
                noise.noise(x * 0.1) * (amplitude / 2);
        
        let groundLevel = Math.floor(baseHeight + n);

        for (let y = 0; y < WORLD_HEIGHT; y++) {
            if (y < groundLevel) {
                world[x][y] = BLOCKS.AIR;
            } else if (y === groundLevel) {
                world[x][y] = BLOCKS.GRASS;
                // Шанс сгенерировать дерево
                if (x > 5 && x < WORLD_WIDTH - 5 && Math.random() < 0.05) {
                    generateTree(x, y + 1);
                }
            } else if (y > groundLevel && y < groundLevel + 5) {
                world[x][y] = BLOCKS.DIRT;
            } else {
                // Пещеры (второй слой шума)
                let caveNoise = noise.noise(x * 0.1 + y * 0.1);
                if (caveNoise > 0.6) {
                    world[x][y] = BLOCKS.AIR; // Пещера
                } else {
                    world[x][y] = BLOCKS.STONE;
                }
            }
        }
    }
}

function generateTree(x, y) {
    const height = 3 + Math.floor(Math.random() * 3);
    // Ствол
    for (let i = 0; i < height; i++) {
        if (y - i >= 0) world[x][y - i] = BLOCKS.WOOD;
    }
    // Листва
    for (let lx = x - 2; lx <= x + 2; lx++) {
        for (let ly = y - height - 2; ly <= y - height; ly++) {
            if (lx >= 0 && lx < WORLD_WIDTH && ly >= 0 && Math.abs(lx - x) + Math.abs(ly - (y - height)) < 4) {
                if (world[lx][ly] === BLOCKS.AIR) {
                    world[lx][ly] = BLOCKS.LEAVES;
                }
            }
        }
    }
}

// --- ИГРОК ---
const player = {
    x: WORLD_WIDTH * TILE_SIZE / 2,
    y: 0, // Будет установлено при спавне
    width: 20,
    height: 48, // Чуть меньше 2 блоков
    vx: 0,
    vy: 0,
    grounded: false,
    selectedBlock: BLOCKS.DIRT
};

// Находим поверхность для спавна
function spawnPlayer() {
    const midX = Math.floor(WORLD_WIDTH / 2);
    for (let y = 0; y < WORLD_HEIGHT; y++) {
        if (world[midX][y] !== BLOCKS.AIR) {
            player.y = (y - 2) * TILE_SIZE;
            player.x = midX * TILE_SIZE;
            return;
        }
    }
    player.y = 0;
}

// --- УПРАВЛЕНИЕ ---
const keys = {};
const mouse = { x: 0, y: 0, left: false, right: false };

window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.key >= '1' && e.key <= '5') {
        const blocks = [BLOCKS.DIRT, BLOCKS.GRASS, BLOCKS.STONE, BLOCKS.WOOD, BLOCKS.LEAVES];
        player.selectedBlock = blocks[parseInt(e.key) - 1];
        updateInventoryUI();
    }
});
window.addEventListener('keyup', e => keys[e.code] = false);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

canvas.addEventListener('mousemove', e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});
canvas.addEventListener('mousedown', e => {
    if (e.button === 0) mouse.left = true;
    if (e.button === 2) mouse.right = true;
});
canvas.addEventListener('mouseup', e => {
    if (e.button === 0) mouse.left = false;
    if (e.button === 2) mouse.right = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// --- ФИЗИКА И КОЛЛИЗИИ ---
function checkCollision(newX, newY) {
    // Проверяем углы хитбокса игрока
    const points = [
        { x: newX, y: newY },
        { x: newX + player.width, y: newY },
        { x: newX, y: newY + player.height },
        { x: newX + player.width, y: newY + player.height }
    ];

    for (let p of points) {
        const tx = Math.floor(p.x / TILE_SIZE);
        const ty = Math.floor(p.y / TILE_SIZE);

        if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) continue;
        
        if (world[tx][ty] !== BLOCKS.AIR) {
            return true;
        }
    }
    return false;
}

function updatePhysics() {
    // Горизонтальное движение
    if (keys['KeyA'] || keys['ArrowLeft']) player.vx = -PLAYER_SPEED;
    else if (keys['KeyD'] || keys['ArrowRight']) player.vx = PLAYER_SPEED;
    else player.vx = 0;

    // Прыжок
    if ((keys['KeyW'] || keys['ArrowUp'] || keys['Space']) && player.grounded) {
        player.vy = -JUMP_FORCE;
        player.grounded = false;
    }

    // Гравитация
    player.vy += GRAVITY;
    if (player.vy > TERMINAL_VELOCITY) player.vy = TERMINAL_VELOCITY;

    // Применение движения с коллизиями
    // X ось
    if (!checkCollision(player.x + player.vx, player.y)) {
        player.x += player.vx;
    } else {
        // Простое выравнивание по сетке при ударе о стену
        player.vx = 0;
    }

    // Y ось
    player.grounded = false;
    if (!checkCollision(player.x, player.y + player.vy)) {
        player.y += player.vy;
    } else {
        if (player.vy > 0) player.grounded = true;
        player.vy = 0;
        // Выравнивание по сетке
        player.y = Math.round(player.y / TILE_SIZE) * TILE_SIZE; 
        // Небольшая коррекция, чтобы не застревать
        if(player.grounded) {
             while(checkCollision(player.x, player.y - 1)) player.y--;
        }
    }

    // Границы мира
    if (player.x < 0) player.x = 0;
    if (player.x > WORLD_WIDTH * TILE_SIZE - player.width) player.x = WORLD_WIDTH * TILE_SIZE - player.width;
    if (player.y > WORLD_HEIGHT * TILE_SIZE) {
        // Респавн если упал в бездну (баг генерации)
        player.y = 0; 
        player.vy = 0;
    }
}

// --- ВЗАИМОДЕЙСТВИЕ С МИРОМ ---
function interactWithWorld() {
    // Камера
    const camX = player.x - canvas.width / 2;
    const camY = player.y - canvas.height / 2;

    const mouseXWorld = mouse.x + camX;
    const mouseYWorld = mouse.y + camY;

    const tx = Math.floor(mouseXWorld / TILE_SIZE);
    const ty = Math.floor(mouseYWorld / TILE_SIZE);

    if (tx < 0 || tx >= WORLD_WIDTH || ty < 0 || ty >= WORLD_HEIGHT) return;

    // Дистанция взаимодействия (5 блоков)
    const px = player.x + player.width / 2;
    const py = player.y + player.height / 2;
    const dist = Math.hypot(px - mouseXWorld, py - mouseYWorld);

    if (dist > 200) return; // Слишком далеко

    if (mouse.left) {
        world[tx][ty] = BLOCKS.AIR; // Копать
    } else if (mouse.right) {
        if (world[tx][ty] === BLOCKS.AIR) {
            // Нельзя ставить блок внутрь игрока
            const blockRect = { x: tx * TILE_SIZE, y: ty * TILE_SIZE, w: TILE_SIZE, h: TILE_SIZE };
            const playerRect = { x: player.x, y: player.y, w: player.width, h: player.height };
            
            if (!(playerRect.x < blockRect.x + blockRect.w &&
                  playerRect.x + playerRect.w > blockRect.x &&
                  playerRect.y < blockRect.y + blockRect.h &&
                  playerRect.y + playerRect.h > blockRect.y)) {
                world[tx][ty] = player.selectedBlock;
            }
        }
    }
}

// --- ОТРИСОВКА ---
function draw() {
    // Очистка
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Камера
    const camX = Math.floor(player.x - canvas.width / 2);
    const camY = Math.floor(player.y - canvas.height / 2);

    ctx.save();
    ctx.translate(-camX, -camY);

    // Отрисовка видимой части мира (Culling)
    const startCol = Math.floor(camX / TILE_SIZE);
    const endCol = startCol + (canvas.width / TILE_SIZE) + 1;
    const startRow = Math.floor(camY / TILE_SIZE);
    const endRow = startRow + (canvas.height / TILE_SIZE) + 1;

    for (let x = startCol; x <= endCol; x++) {
        for (let y = startRow; y <= endRow; y++) {
            if (x >= 0 && x < WORLD_WIDTH && y >= 0 && y < WORLD_HEIGHT) {
                const block = world[x][y];
                if (block !== BLOCKS.AIR) {
                    ctx.fillStyle = BLOCK_COLORS[block];
                    ctx.fillRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                    
                    // Добавим немного "текстуры" (рамка)
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.strokeRect(x * TILE_SIZE, y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }
    }

    // Отрисовка игрока
    ctx.fillStyle = '#FF5722'; // Оранжевый персонаж
    ctx.fillRect(player.x, player.y, player.width, player.height);
    
    // Глаза (чтобы было видно направление)
    ctx.fillStyle = 'white';
    const eyeOffset = player.vx >= 0 ? 12 : 4;
    ctx.fillRect(player.x + eyeOffset, player.y + 8, 4, 4);

    // Курсор выделения
    const mouseXWorld = mouse.x + camX;
    const mouseYWorld = mouse.y + camY;
    const tx = Math.floor(mouseXWorld / TILE_SIZE);
    const ty = Math.floor(mouseYWorld / TILE_SIZE);
    
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.strokeRect(tx * TILE_SIZE, ty * TILE_SIZE, TILE_SIZE, TILE_SIZE);

    ctx.restore();
}

// --- UI ИНВЕНТАРЯ ---
function initInventory() {
    const inv = document.getElementById('inventory');
    const items = [
        { type: BLOCKS.DIRT, color: BLOCK_COLORS[BLOCKS.DIRT] },
        { type: BLOCKS.GRASS, color: BLOCK_COLORS[BLOCKS.GRASS] },
        { type: BLOCKS.STONE, color: BLOCK_COLORS[BLOCKS.STONE] },
        { type: BLOCKS.WOOD, color: BLOCK_COLORS[BLOCKS.WOOD] },
        { type: BLOCKS.LEAVES, color: BLOCK_COLORS[BLOCKS.LEAVES] }
    ];

    items.forEach((item, index) => {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.style.backgroundColor = item.color;
        slot.onclick = () => {
            player.selectedBlock = item.type;
            updateInventoryUI();
        };
        slot.id = `slot-${index}`;
        inv.appendChild(slot);
    });
    updateInventoryUI();
}

function updateInventoryUI() {
    const map = [BLOCKS.DIRT, BLOCKS.GRASS, BLOCKS.STONE, BLOCKS.WOOD, BLOCKS.LEAVES];
    const idx = map.indexOf(player.selectedBlock);
    document.querySelectorAll('.slot').forEach((el, i) => {
        if (i === idx) el.classList.add('active');
        else el.classList.remove('active');
    });
}

// --- ГЛАВНЫЙ ЦИКЛ ---
generateWorld();
spawnPlayer();
initInventory();

function loop() {
    updatePhysics();
    interactWithWorld();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>
</body>
</html>
